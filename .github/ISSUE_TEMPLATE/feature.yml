name: Feature / Capability (ODD Ready)
description: Propose a verifiable feature or capability for the Pepinillo Software Factory
title: "feat: "
labels: ["status:new", "type:feat"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective & User/System Value
      description: One-paragraph description of the problem and desired outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable Acceptance Criteria (S1..Sn)
      description: Concrete, deterministic behaviors and edge cases that must be proven by tests.
      value: |
        - **S1**:
        - **S2**:
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Explicit Exclusions (Out of Scope)
      description: What the implementer MUST NOT touch or build in this issue.
    validations:
      required: true
  - type: dropdown
    id: surfaces
    attributes:
      label: Affected Surfaces
      multiple: true
      options:
        - contracts (OpenAPI 3.1)
        - backend (Go)
        - ios (iPhone/iPad)
        - watchos (Apple Watch)
        - macos (PepinilloMac)
        - android (phone/tablet)
        - wear-os (Wear OS)
        - factory / ci / docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: size:l (>400 changed lines) requires chained-pr slicing before implementation.
      options:
        - size:xs (<50 lines)
        - size:s (50–150 lines)
        - size:m (150–400 lines)
        - size:l (>400 lines)
    validations:
      required: true
  - type: checkboxes
    id: ux
    attributes:
      label: UX Shaping
      description: Check if the issue introduces a new user-facing screen or alters multi-step navigation (adds `ux:shape` and requires a UX brief before implementation).
      options:
        - label: Requires UX brief (ux:shape)

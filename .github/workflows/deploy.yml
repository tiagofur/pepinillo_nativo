name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pepinillo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pepinillo_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-only
          APP_ENV: test
        run: go test -race -count=1 ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: /home/deploy/pepinillo
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "Missing required production secrets: SSH_HOST, SSH_USER, SSH_KEY"
            exit 1
          fi

          # Create SSH directory and add host key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fetch and add host key to known_hosts (GitHub Actions server key)
          ssh-keyscan -p ${SSH_PORT} ${SSH_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true

          # SSH configuration
          cat > ~/.ssh/config << EOF
          Host deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

          # Ship only deployment-relevant files to keep transfer fast and deterministic
          tar -czf /tmp/pepinillo_deploy_bundle.tgz backend .github/workflows
          scp /tmp/pepinillo_deploy_bundle.tgz deploy:/tmp/pepinillo_deploy_bundle.tgz

          # Deploy: unpack bundle, build API image, restart API only
          ssh deploy << DEPLOY_SCRIPT
          set -e
          mkdir -p ${APP_DIR}
          cd ${APP_DIR}

          mv /tmp/pepinillo_deploy_bundle.tgz ./pepinillo_deploy_bundle.tgz

          tar -xzf pepinillo_deploy_bundle.tgz
          rm -f pepinillo_deploy_bundle.tgz

          if [ ! -f backend/.env.production ]; then
            echo "Missing required file: backend/.env.production"
            exit 1
          fi

          cd backend

          # Build the API image (no cache to ensure fresh binary)
          docker compose -f docker-compose.prod.yml build --no-cache api

          # Restart only API to avoid touching existing db/redis managed on VPS
          docker compose -f docker-compose.prod.yml up -d --no-deps api
          DEPLOY_SCRIPT

          # Health check from inside VPS to avoid false negatives from reverse-proxy config
          HEALTH_CHECK_URL="http://127.0.0.1:8090/api/v1/health"
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ssh deploy "curl -sf ${HEALTH_CHECK_URL} > /dev/null"; then
              echo "Health check passed!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 2s..."
            sleep 2
          done

          echo "Health check failed after $MAX_RETRIES attempts"

          # On health check failure, log container status for debugging (no rollback to avoid making things worse)
          echo "Checking container status..."
          ssh deploy "cd ${APP_DIR}/backend && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=50 api" || true

          exit 1

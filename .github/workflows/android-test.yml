name: Android Tests

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Targeted suite (mirrors iOS CI): fast PR feedback. SyncEngineTest is
      # excluded until #281/#282 land — full suite exceeds timeout on GHA.
      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon \
            --tests 'dev.creapolis.pepinillo.data.repository.*' \
            --tests 'dev.creapolis.pepinillo.feature.dashboard.DashboardScreenTest' \
            --tests 'dev.creapolis.pepinillo.core.auth.*' \
            --tests 'dev.creapolis.pepinillo.core.billing.*' \
            --tests 'dev.creapolis.pepinillo.domain.timer.*'
name: Pepinillo Windows CI Build & Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'windows/**'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9 (required by Windows App SDK 1.6 XAML compiler)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore windows/Pepinillo.slnx

    - name: Run Core Unit Tests
      run: dotnet test windows/Pepinillo.Core.Tests/Pepinillo.Core.Tests.csproj --configuration Release

    - name: Build WinUI 3 App (x64)
      run: dotnet build windows/Pepinillo.WinUI/Pepinillo.WinUI.csproj --configuration Release -r win-x64 --no-restore

    - name: Build WinUI 3 App (ARM64)
      run: dotnet build windows/Pepinillo.WinUI/Pepinillo.WinUI.csproj --configuration Release -r win-arm64 --no-restore

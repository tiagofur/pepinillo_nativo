name: Deploy Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - name: Type check
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: landing/build/
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: landing-build

      - name: Deploy to VPS via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${SSH_PORT} ${SSH_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

          # Marketing site (landing + guides) → pepinillo.app docroot.
          tar -czf /tmp/pepinillo_landing_bundle.tgz -C landing-build .
          scp -P ${SSH_PORT} /tmp/pepinillo_landing_bundle.tgz deploy:/tmp/pepinillo_landing_bundle.tgz

          ssh -p ${SSH_PORT} deploy << 'DEPLOY_SCRIPT'
          set -e
          BASE=/var/www/vhosts/pepinillo.app
          rm -rf /tmp/pepinillo_landing_build
          mkdir -p /tmp/pepinillo_landing_build
          tar -xzf /tmp/pepinillo_landing_bundle.tgz -C /tmp/pepinillo_landing_build
          mkdir -p "$BASE/httpdocs"
          rsync -a --no-o --no-g --no-perms -O --delete --exclude='.well-known' /tmp/pepinillo_landing_build/ "$BASE/httpdocs/"
          sudo /usr/sbin/nginx -t
          sudo /usr/sbin/nginx -s reload
          rm -rf /tmp/pepinillo_landing_build /tmp/pepinillo_landing_bundle.tgz
          echo "Landing deployed: https://pepinillo.app"
          DEPLOY_SCRIPT

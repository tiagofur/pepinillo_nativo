name: iOS Tests

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-test.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: false
        default: auto
        type: choice
        options:
          - auto
          - fast
          - full

# Cancel stale runs on the same PR/branch — avoids stacking macOS jobs in queue.
concurrency:
  group: ios-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # iOS + watchOS gate (job id `test` kept: required-check names depend on it).
  # One job builds the whole embedded chain — the app target embeds the watch
  # app at target level (project.yml), so the watch app + watch widget build
  # here regardless of scheme; that keeps watchOS compile coverage on every
  # PR. Tests themselves only take 1.5–2.5 min; the cost is the build, so
  # DerivedData caching turns the 15–24 min full build into an incremental
  # rebuild on cache hits.
  # Cache write policy (issue #921): ONLY pushes to main save caches. Every
  # PR writing its own full DerivedData into the 10 GB repo cache evicted the
  # canonical entries — restores went cold and builds jumped from ~12-14 min
  # to 25+. PRs restore main's latest cache and build their delta on top; the
  # post-job save step (~2 min) also disappears from the PR critical path.
  # Simulator boot (1.5 min) overlaps the build via a background process and
  # is only awaited right before test execution.
  # Rollback note: if the cache ever yields flaky "module not found" builds,
  # remove the "Restore DerivedData" step and the -derivedDataPath flags —
  # everything else is independent of it.
  test:
    runs-on: macos-15
    # PRs: fail fast on simulator hangs (the per-step 12-minute caps on the
    # simulator and fast-gate steps still enforce that). Main: allow
    # integration + timer suites. Budget stays 35/45 to tolerate cold runs
    # (first run after this change, runner image or Xcode bumps).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 35 || 45 }}

    defaults:
      run:
        working-directory: ios

    env:
      # Pin SPM location so cache + xcodebuild share the same package checkout.
      CLONED_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.spm-cache
      # Explicit DerivedData path so the cache + every xcodebuild step share it.
      DERIVED_DATA_PATH: ${{ github.workspace }}/ios/DerivedData
      # auto = fast on PR, full on push/main
      TEST_SUITE: ${{ github.event.inputs.suite || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Swift Package Manager cache
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CLONED_SOURCE_PACKAGES_PATH }}
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml', 'ios/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Incremental build cache: restore the closest previous DerivedData and
      # let xcodebuild rebuild only what the diff touched. The key pins the
      # Xcode version (image bumps invalidate cleanly) and hashes every file
      # under ios/ (sources, assets, xcconfigs, project.yml). Saved only from
      # main (see the job comment for the eviction rationale).
      - name: Restore DerivedData cache
        id: dd
        uses: actions/cache/restore@v4
        with:
          path: ios/DerivedData
          key: ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('ios/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-dd-

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-v1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Trust Swift package macros (CI)
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Resolve simulator and start boot in background
        id: sim
        run: |
          pick_simulator() {
            xcrun simctl list devices available \
              | grep -E "$1" \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
              | head -1
          }
          # Prefer smaller simulators — faster boot, same test coverage for unit tests.
          DEST=$(pick_simulator 'iPhone 16 \(')
          if [ -z "$DEST" ]; then
            DEST=$(pick_simulator 'iPhone 17 \(')
          fi
          if [ -z "$DEST" ]; then
            echo "No suitable iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEST" 2>/dev/null || true
          # Boot overlaps the build: background process survives across steps,
          # "Wait for simulator" awaits it right before test execution.
          nohup xcrun simctl bootstatus "$DEST" -b > /tmp/bootstatus.log 2>&1 &
          echo $! > /tmp/boot.pid
          echo "id=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using simulator ID: $DEST (booting in background)"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "Pepinillo Dev" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_PATH" \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing

      - name: Wait for simulator
        timeout-minutes: 5
        run: |
          DEST="${{ steps.sim.outputs.id }}"
          # The background bootstatus already exited if the boot finished
          # during the build; re-run bootstatus as an idempotent barrier.
          wait "$(cat /tmp/boot.pid)" 2>/dev/null || true
          xcrun simctl bootstatus "$DEST" -b
          echo "Simulator booted: $DEST"

      - name: Select test suite
        id: suite
        run: |
          suite="$TEST_SUITE"
          if [ "$suite" = "auto" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              suite="fast"
            else
              suite="full"
            fi
          fi
          echo "mode=$suite" >> "$GITHUB_OUTPUT"
          echo "Running $suite test suite"

      # AppFeatureIntegrationTests excluido de ambas puertas: 2 tests fallan
      # por efectos escapados de suscripción (contaminación cruzada
      # preexistente que el hueco de #986 escondía) — follow-up #1003.
      - name: Run targeted tests (fast — PR gate)
        if: steps.suite.outputs.mode == 'fast'
        timeout-minutes: 12
        run: |
          set -o pipefail
          # Fast gate (~60 tests, ~2–3 min). Skips integration + FocusEngine timer
          # suites that intermittently hang the simulator on GHA (issue: 2h stalls).
          xcodebuild \
            -scheme "Pepinillo Dev" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -only-testing:PepinilloTests/TaskListFeatureTests \
            -only-testing:PepinilloTests/PaywallFeatureTests \
            -only-testing:PepinilloTests/FocusFeatureReducerTests \
            -only-testing:PepinilloTests/AppGroupContainerTests \
            -only-testing:PepinilloTests/WidgetProGatingTests \
            -only-testing:PepinilloTests/TasksWidgetQueryTests \
            -only-testing:PepinilloTests/FocusActivityAttributesTests \
            -only-testing:PepinilloTests/SiriPauseResumeIntentTests

      - name: Run targeted tests (full — main)
        if: steps.suite.outputs.mode == 'full'
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "Pepinillo Dev" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CLONED_SOURCE_PACKAGES_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -only-testing:PepinilloTests/LocalToCloudStoreMigratorTests \
            -only-testing:PepinilloTests/PersistenceStoreRouterTests \
            -only-testing:PepinilloTests/AppGroupContainerTests \
            -only-testing:PepinilloTests/WidgetProGatingTests \
            -only-testing:PepinilloTests/TasksWidgetQueryTests \
            -only-testing:PepinilloTests/FocusActivityAttributesTests \
            -only-testing:PepinilloTests/FocusEngineInitialStateTests \
            -only-testing:PepinilloTests/FocusEngineStartTests \
            -only-testing:PepinilloTests/FocusEnginePauseResumeTests \
            -only-testing:PepinilloTests/FocusEngineStopTests \
            -only-testing:PepinilloTests/FocusEngineInterruptionTests \
            -only-testing:PepinilloTests/FocusEngineSessionReplacementTests \
            -only-testing:PepinilloTests/FocusEngineCustomDurationTests \
            -only-testing:PepinilloTests/FocusEngineLinkedTaskTests \
            -only-testing:PepinilloTests/FocusEngineTimerTests \
            -only-testing:PepinilloTests/FocusEngineSkipPhaseTests \
            -only-testing:PepinilloTests/FocusEngineConfigTests \
            -only-testing:PepinilloTests/FocusEngineFlowtimeBreakTests \
            -only-testing:PepinilloTests/FocusEngineDailyPomodoroSeedTests \
            -only-testing:PepinilloTests/FocusEngineExternalTimerTests \
            -only-testing:PepinilloTests/FocusEngineMidpointTests \
            -only-testing:PepinilloTests/FocusEngineConfigUpdateTests \
            -only-testing:PepinilloTests/FocusEngineSessionTotalTests \
            -only-testing:PepinilloTests/FocusEngineAnchoredPauseTests \
            -only-testing:PepinilloTests/FocusEngineSkippedWorkTests \
            -only-testing:PepinilloTests/FocusEngineHoldStopTests \
            -only-testing:PepinilloTests/FocusEngineExtendWorkTests \
            -only-testing:PepinilloTests/FocusEngineAbandonTests \
            -only-testing:PepinilloTests/FocusEngineGhostAdoptionTests \
            -only-testing:PepinilloTests/FocusEngineGhostResumeTests \
            -only-testing:PepinilloTests/FocusFeatureReducerTests \
            -only-testing:PepinilloTests/SiriPauseResumeIntentTests \
            -only-testing:PepinilloTests/TaskListFeatureTests

      # Canonical caches are written by main only (issue #921): PR builds
      # consume main's cache without adding entries, so the 10 GB repo cache
      # stops evicting the warm DerivedData every PR run used to push out.
      - name: Save Swift Package Manager cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CLONED_SOURCE_PACKAGES_PATH }}
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm.outputs.cache-primary-key }}

      - name: Save DerivedData cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ios/DerivedData
          key: ${{ steps.dd.outputs.cache-primary-key }}

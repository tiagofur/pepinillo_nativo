# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable AndroidX
android.useAndroidX=true

# Required for KSP compatibility with AGP 9.0+ built-in Kotlin
android.disallowKotlinSourceSets=false

# Environment fixes for build services and jlink
# org.gradle.java.home=/opt/homebrew/Cellar/openjdk@21/21.0.10/libexec/openjdk.jdk/Contents/Home
# systemProp.android.user.home=/Users/tiagofur/.android

# Dependencies resolution constraints
android.dependency.useConstraints=true

# Suppress certain warnings if absolutely necessary, but keeping it clean is better
# android.suppressUnsupportedCompileSdk=37

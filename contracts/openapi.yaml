openapi: 3.1.0
info:
  title: Software Factory Base API Contract
  version: 0.1.0
  summary: Canonical Contract-First OpenAPI 3.1 specification (ADR-0003).
  description: |
    Single source of truth for HTTP routes, request/response payloads, and RFC 9457 Problem Details error shapes across Go backend, React+Vite web, Tauri v2, and native mobile surfaces.
  contact:
    name: Software Factory Architecture Team
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development Go API server

tags:
  - name: system
    description: Operational health, readiness, and metadata endpoints.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Liveness and readiness probe
      description: Returns the current operational status of the backend service and its primary persistence adapter.
      responses:
        "200":
          description: Service is healthy and ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service or backing store is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: Aggregate service status indicator.
        service:
          type: string
          description: Canonical project name from factory.manifest.json.
        version:
          type: string
          description: Semantic version or build commit identifier.

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs (application/problem+json).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies the specific occurrence of the problem.
        errors:
          type: array
          description: Optional field-level validation issues.
          items:
            $ref: "#/components/schemas/FieldValidationError"

    FieldValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: JSON pointer or field path that failed validation.
        reason:
          type: string
          description: Machine- or human-readable explanation of the validation rule violation.

openapi: 3.1.0
info:
  title: Pepinillo API
  version: 1.1.0
  summary: Contrato OpenAPI 3.1 canónico del backend Go de Pepinillo (`/api/v1`).
  description: |
    Fuente de verdad HTTP del backend Go (Fiber v2 + GORM + PostgreSQL 16 + Redis 7) en `backend/internal/adapters/handlers/routes.go`.

    ### Autenticación y compuertas de middleware
    - **Público**: `/health*`, `/auth/{register,login,google,apple,refresh,forgot-password,reset-password,verify-email,resend-verification}`
    - **Webhook Token**: `POST /webhooks/revenuecat` valida `Authorization` contra `REVENUECAT_WEBHOOK_AUTH_TOKEN`.
    - **JWT (`BearerAuth`)**: requiere access token (`tokenType == "access"`). Da acceso a `/auth/*` protegidas, `/users/me*` y `/billing/verify-receipt`.
    - **JWT + Email verificado**: todas las rutas de datos (`/tasks`, `/pomodoro`, `/focus`, `/ai`, `/push`, `/analytics`, `/preferences`, `/sync`).
    - **Pepinillo+ / Everywhere+**: `/analytics/*` exige `advanced_analytics`.
    - **Everywhere+ (`everywhere_monthly` | `everywhere_annual`)**: `/sync/*`, `/tasks/sync`, `PUT /preferences` (requieren `RequireBackendSync` → `402 ERR_TIER_INSUFFICIENT`) y `/ai/*` (requieren `predictions` + créditos mensuales).

    ### WebSocket (`/api/v1/ws`)
    El canal en tiempo real usa `GET /api/v1/ws` (upgrade WebSocket, auth vía `Authorization: Bearer <jwt>` o `Sec-WebSocket-Protocol: bearer, <jwt>`, parámetro opcional `deviceId`) con sobres `WSMessage { type, data, timestamp, channels }` y eventos `task_updated`, `task_deleted`, `focus_config_updated`, `focus_session_created`, `focus_session_updated`, `pomodoro_*`, `settings_updated`, `sessions_synced`, `initial_upload_completed`, `user_updated`, `pong`.

    ### Contrato de errores
    El handler global actual serializa `ErrorEnvelope` (`{"error": "<code|message>"}`), y `RequireBackendSync` devuelve `BackendSyncRequiredError` (`402 ERR_TIER_INSUFFICIENT`). Para nuevos endpoints se adopta gradualmente RFC 9457 (`ProblemDetails`, `ADR-0003`).
  contact:
    name: Pepinillo Engineering (Creapolis)
    email: hola@creapolis.dev
servers:
  - url: https://api.ppn.creapolis.dev/api/v1
    description: Producción (IONOS VPS + Caddy)
  - url: https://staging.api.ppn.creapolis.dev/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Desarrollo local

tags:
  - name: system
    description: Salud, dependencias, métricas Prometheus, alertas y SLOs.
  - name: webhooks
    description: Webhooks externos autenticados por token (RevenueCat).
  - name: auth
    description: Registro, login, JWT refresh rotation, recuperación y verificación de email.
  - name: oauth
    description: Login y vinculación con Google y Sign in with Apple.
  - name: users
    description: Perfil de usuario autenticado e imagen de avatar.
  - name: billing
    description: Verificación server-side de recibos App Store y Google Play.
  - name: tasks
    description: Tareas, recurrencias, seguimiento por modo de foco y sincronización LWW.
  - name: subtasks
    description: Subtareas asociadas a una tarea.
  - name: focus
    description: Motor unificado multi-modo (Pomodoro, Flowtime, TimeBlock, Stopwatch).
  - name: pomodoro
    description: Endpoints legacy de Pomodoro mantenidos por retrocompatibilidad.
  - name: ai
    description: Insights, análisis, reportes y predicciones en la nube (Everywhere+ y créditos IA).
  - name: analytics
    description: Reportes semanales/mensuales, tasa de completado y rachas (Pepinillo+ / Everywhere+).
  - name: push
    description: Registro y envío de notificaciones push APNs/FCM.
  - name: preferences
    description: Preferencias sincronizables de usuario.
  - name: sync
    description: Sincronización multi-dispositivo paginada con reloj LWW (Everywhere+).

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Probe básico de vida del servicio API
      responses:
        "200":
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/deps:
    get:
      operationId: getHealthDependencies
      tags: [system]
      summary: Estado de dependencias (PostgreSQL, Redis, MinIO, ML)
      responses:
        "200":
          description: Estado agregado y por dependencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDepsResponse"

  /health/metrics:
    get:
      operationId: getHealthMetrics
      tags: [system]
      summary: Métricas operativas JSON (billing, push, recurrence)
      responses:
        "200":
          description: Contadores y latencias agregadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthMetricsResponse"

  /health/metrics/prometheus:
    get:
      operationId: getHealthPrometheusMetrics
      tags: [system]
      summary: Métricas en formato de texto Prometheus
      responses:
        "200":
          description: Exposición Prometheus 0.0.4.
          content:
            text/plain:
              schema:
                type: string

  /health/alerts:
    get:
      operationId: getHealthAlerts
      tags: [system]
      summary: Alertas activas y suprimidas por ventana de enfriamiento
      responses:
        "200":
          description: Estado actual de alertas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAlertsResponse"

  /health/alerts/rules:
    get:
      operationId: getHealthAlertRules
      tags: [system]
      summary: Reglas y umbrales configurados para alertas
      responses:
        "200":
          description: Configuración activa de umbrales y mute window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAlertRulesResponse"

  /health/alerts/alertmanager:
    get:
      operationId: getHealthAlertmanager
      tags: [system]
      summary: Alertas en formato compatible con Alertmanager
      responses:
        "200":
          description: Lista de alertas activas en formato Alertmanager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAlertmanagerResponse"

  /health/slo:
    get:
      operationId: getHealthSLO
      tags: [system]
      summary: Estado de SLOs de billing, push y recurrencias
      responses:
        "200":
          description: Evaluación actual de SLOs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSLOResponse"

  /webhooks/revenuecat:
    post:
      operationId: handleRevenueCatWebhook
      tags: [webhooks]
      summary: Webhook de eventos de suscripción/compra desde RevenueCat
      security:
        - WebhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhookPayload"
      responses:
        "200":
          description: Evento procesado, deduplicado o ignorado por ID anónimo.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "502":
          $ref: "#/components/responses/BadGatewayError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Registrar nueva cuenta con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Cuenta creada con tokens JWT iniciales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Iniciar sesión con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [oauth]
      summary: Iniciar sesión o crear cuenta con Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthRequest"
      responses:
        "200":
          description: Sesión autenticada con Google.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /auth/apple:
    post:
      operationId: loginWithApple
      tags: [oauth]
      summary: Iniciar sesión o crear cuenta con Sign in with Apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleOAuthRequest"
      responses:
        "200":
          description: Sesión autenticada con Apple.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotar refresh token y emitir nuevo par de tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Nuevo par de access y refresh tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensEnvelope"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Solicitar código de recuperación de contraseña por email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnlyRequest"
      responses:
        "204":
          description: Solicitud aceptada (no revela existencia de la cuenta).
        "400":
          $ref: "#/components/responses/BadRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Restablecer contraseña usando código recibido por email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Contraseña actualizada.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verificar email con código de un solo uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verificado y tokens actualizados con claim `emailVerified=true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Reenviar código de verificación de email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnlyRequest"
      responses:
        "200":
          description: Código reenviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Eliminar cuenta del usuario autenticado (y revocar Apple token si aplica)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Cuenta eliminada.
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Cerrar sesión revocando uno o todos los refresh tokens
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Sesión cerrada.
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Cambiar contraseña del usuario autenticado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Contraseña cambiada.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /auth/request-email-change:
    post:
      operationId: requestEmailChange
      tags: [auth]
      summary: Solicitar cambio de email con verificación al nuevo correo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailChangeRequest"
      responses:
        "200":
          description: Código enviado al nuevo correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangePendingResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/confirm-email-change:
    post:
      operationId: confirmEmailChange
      tags: [auth]
      summary: Confirmar cambio de email con el código enviado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeOnlyRequest"
      responses:
        "200":
          description: Email actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/cancel-email-change:
    post:
      operationId: cancelEmailChange
      tags: [auth]
      summary: Cancelar cambio de email pendiente
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cambio pendiente cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/link/google:
    post:
      operationId: linkGoogleAccount
      tags: [oauth]
      summary: Vincular cuenta de Google al usuario autenticado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthRequest"
      responses:
        "200":
          description: Proveedor Google vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/link/apple:
    post:
      operationId: linkAppleAccount
      tags: [oauth]
      summary: Vincular Sign in with Apple al usuario autenticado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleOAuthRequest"
      responses:
        "200":
          description: Proveedor Apple vinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/unlink/google:
    delete:
      operationId: unlinkGoogleAccount
      tags: [oauth]
      summary: Desvincular Google (falla si es el último método de autenticación)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Google desvinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/unlink/apple:
    delete:
      operationId: unlinkAppleAccount
      tags: [oauth]
      summary: Desvincular Apple (falla si es el último método de autenticación)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Apple desvinculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/providers:
    get:
      operationId: getLinkedProviders
      tags: [oauth]
      summary: Listar métodos de autenticación vinculados del usuario actual
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Proveedores vinculados y presencia de contraseña.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedProviders"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Obtener perfil del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Perfil actual incluyendo tier efectivo y créditos IA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      operationId: updateCurrentUser
      tags: [users]
      summary: Actualizar nombre o imageUrl del perfil (el email requiere flujo de verificación)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/me/image:
    post:
      operationId: uploadProfileImage
      tags: [users]
      summary: Subir imagen de avatar (JPEG, PNG o WebP, máximo 5 MiB)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: URL pública/firmada de la imagen subida.
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl:
                    type: string
                    format: uri-reference
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /billing/verify-receipt:
    post:
      operationId: verifyReceipt
      tags: [billing]
      summary: Verificar recibo de compra Apple App Store o Google Play
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyReceiptInput"
      responses:
        "200":
          description: Resultado de verificación y tier actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyReceiptResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Listar tareas del usuario (opcionalmente filtradas por fecha)
      security:
        - BearerAuth: []
      parameters:
        - name: finishDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de tareas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: upsertTask
      tags: [tasks]
      summary: Crear o actualizar una tarea
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
      responses:
        "200":
          description: Tarea guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updateTaskById
      tags: [tasks]
      summary: Actualizar una tarea existente
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Task"
      responses:
        "200":
          description: Tarea actualizada.
          content:

    post:
      operationId: sendTestPush
      tags: [push]
      summary: Enviar notificación push de prueba a los dispositivos del usuario
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: Push enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /analytics/weekly-report:
    get:
      operationId: getAnalyticsWeeklyReport
      tags: [analytics]
      summary: Reporte semanal agregado (Pepinillo+ / Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Métricas semanales por modo, top tareas y racha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReport"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /analytics/monthly-report:
    get:
      operationId: getAnalyticsMonthlyReport
      tags: [analytics]
      summary: Reporte mensual agregado (Pepinillo+ / Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          description: Formato YYYY-MM
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
      responses:
        "200":
          description: Métricas mensuales por modo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /analytics/completion-rate:
    get:
      operationId: getAnalyticsCompletionRate
      tags: [analytics]
      summary: Tasa de completado por modo en rango de fechas
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tasas de completado y sesiones abandonadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionRateStats"

  /analytics/streak:
    get:
      operationId: getAnalyticsStreak
      tags: [analytics]
      summary: Racha actual, máxima y por modo de foco
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Estadísticas de racha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakStats"

  /preferences:
    get:
      operationId: listPreferences
      tags: [preferences]
      summary: Listar preferencias guardadas del usuario
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Preferencias clave-valor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPreference"
    put:
      operationId: upsertPreferences
      tags: [preferences]
      summary: Guardar preferencias sincronizables (requiere Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items:
                    $ref: "#/components/schemas/UserPreference"
      responses:
        "200":
          description: Preferencias actualizadas con timestamp de servidor.
          content:
            application/json:
              schema:
                type: object
                required: [preferences, serverTimestamp]
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPreference"
                  serverTimestamp:
                    type: string
                    format: date-time
        "402":
          $ref: "#/components/responses/SubscriptionRequiredError"

  /sync/full:
    get:
      operationId: getFullSync
      tags: [sync]
      summary: Pull paginado de tareas, sesiones y preferencias (requiere Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - name: taskCursor
          in: query
          schema:
            type: string
        - name: sessionCursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Snapshot paginado y timestamp del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullSyncResponse"
        "402":
          $ref: "#/components/responses/SubscriptionRequiredError"

  /sync/has-data:
    get:
      operationId: getSyncHasData
      tags: [sync]
      summary: Consultar si la cuenta ya tiene datos sincronizados en el servidor
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Indicador booleano.
          content:
            application/json:
              schema:
                type: object
                required: [hasData]
                properties:
                  hasData:
                    type: boolean
        "402":
          $ref: "#/components/responses/SubscriptionRequiredError"

  /sync/sessions:
    post:
      operationId: syncSessions
      tags: [sync]
      summary: Sincronización LWW en lote de sesiones de foco (requiere Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSyncRequest"
      responses:
        "200":
          description: Sesiones fusionadas y `serverTimestamp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSyncResponse"
        "402":
          $ref: "#/components/responses/SubscriptionRequiredError"

  /sync/initial-upload:
    post:
      operationId: initialUploadSync
      tags: [sync]
      summary: Fusión inicial completa de datos locales con el servidor (requiere Everywhere+)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialUploadRequest"
      responses:
        "200":
          description: Estado fusionado devuelto al cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialUploadResponse"
        "402":
          $ref: "#/components/responses/SubscriptionRequiredError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    WebhookToken:
      type: http
      scheme: bearer
      description: Token configurado en `REVENUECAT_WEBHOOK_AUTH_TOKEN`.

  parameters:
    DeviceIdHeader:
      name: X-Device-ID
      in: header
      required: false
      description: Identificador de dispositivo excluido del broadcast WebSocket de origen.
      schema:
        type: string

  responses:
    BadRequestError:
      description: Petición inválida o error de validación de dominio.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Token ausente, expirado o inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PaymentRequiredError:
      description: Nivel de suscripción insuficiente para funciones cloud.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SubscriptionRequiredError:
      description: Requiere suscripción activa Everywhere+ (`ERR_TIER_INSUFFICIENT`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackendSyncRequiredError"
    ForbiddenError:
      description: Email no verificado o feature fuera del entitlement activo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Conflicto de estado o recurso ya reclamado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequestsError:
      description: Límite de peticiones o créditos IA agotado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGatewayError:
      description: Fallo transitorio procesando webhook/proveedor externo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailableError:
      description: Proveedor o secreto no configurado en el servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Código o mensaje de error devuelto por Fiber `ErrorHandler`.

    BackendSyncRequiredError:
      type: object
      additionalProperties: false
      required: [error, code, message, upgrade_url]
      properties:
        error:
          type: string
          example: subscription_required
        code:
          type: string
          example: ERR_TIER_INSUFFICIENT
        message:
          type: string
        upgrade_url:
          type: string
          format: uri

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SubscriptionTier:
      type: string
      enum: [free, pepinillo_plus, everywhere_monthly, everywhere_annual]

    FocusMode:
      type: string
      enum: [pomodoro, flowtime, timeblock, stopwatch]

    FocusPhase:
      type: string
      enum: [work, short_break, long_break, flow, break, check_in, freeform]

    HealthStatus:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error, disabled, unknown]
        error:
          type: string

    HealthDepsResponse:
      type: object
      required: [status, service, timestamp, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          required: [database, redis, minio, ml]
          properties:
            database:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            minio:
              $ref: "#/components/schemas/DependencyStatus"
            ml:
              $ref: "#/components/schemas/DependencyStatus"

    HealthMetricsResponse:
      type: object
      required: [status, service, timestamp, metrics]
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties: true

    HealthAlertsResponse:
      type: object
      required: [status, service, timestamp, alerts, suppressed, remediation]
      properties:
        status:
          type: string
          enum: [ok, degraded, suppressed]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
        suppressed:
          type: array
          items:
            type: object
            additionalProperties: true
        remediation:
          type: object
          additionalProperties: true

    HealthAlertRulesResponse:
      type: object
      required: [status, service, timestamp, rules]
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        rules:
          type: object
          additionalProperties: true

    HealthAlertmanagerResponse:
      type: object
      required: [status, service, timestamp, alerts, suppressedCount]
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
        suppressedCount:
          type: integer

    HealthSLOResponse:
      type: object
      required: [status, service, timestamp, slo]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        slo:
          type: array
          items:
            type: object
            additionalProperties: true

    RevenueCatWebhookPayload:
      type: object
      required: [api_version, event]
      properties:
        api_version:
          type: string
        event:
          type: object
          required: [type, id, app_user_id]
          properties:
            type:
              type: string
            id:
              type: string
            app_user_id:
              type: string
            aliases:
              type: array
              items:
                type: string
            product_id:
              type: string
            entitlement_ids:
              type: array
              items:
                type: string
            period_type:
              type: string
            purchased_at_ms:
              type: integer
              format: int64
            expiration_at_ms:
              type: integer
              format: int64
            store:
              type: string
            environment:
              type: string
            is_family_share:
              type: boolean
            currency:
              type: string
            price:
              type: number

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64

    User:
      type: object
      required: [id, email, name, subscriptionTier, emailVerified, aiCreditsBalance, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        imageUrl:
          type: ["string", "null"]
        subscriptionTier:
          $ref: "#/components/schemas/SubscriptionTier"
        subscriptionExpiresAt:
          type: ["string", "null"]
          format: date-time
        emailVerified:
          type: boolean
        emailVerifiedAt:
          type: ["string", "null"]
          format: date-time
        pendingEmail:
          type: ["string", "null"]
        emailChangedAt:
          type: ["string", "null"]
          format: date-time
        aiCreditsBalance:
          type: integer
        aiCreditsLastRefreshedAt:
          type: ["string", "null"]
          format: date-time
        pepinilloPlusEntitlementAt:
          type: ["string", "null"]
          format: date-time
        googleId:
          type: ["string", "null"]
        googleEmail:
          type: ["string", "null"]
        googleName:
          type: ["string", "null"]
        googlePicture:
          type: ["string", "null"]
        appleId:
          type: ["string", "null"]
        appleEmail:
          type: ["string", "null"]
        appleName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthSessionResponse:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AuthTokens"

    MessageAuthSessionResponse:
      type: object
      required: [message, user, tokens]
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/AuthTokens"

    MessageUserResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"

    TokensEnvelope:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/AuthTokens"

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    GoogleOAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string

    AppleOAuthRequest:
      type: object
      required: [idToken, nonce]
      properties:
        idToken:
          type: string
        nonce:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CodeOnlyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string

    DeleteAccountRequest:
      type: object
      properties:
        refreshToken:
          type: string
        appleAuthorizationCode:
          type: ["string", "null"]

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72

    RequestEmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          type: string
          format: email

    EmailChangePendingResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
        pendingEmail:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"

    OAuthProvider:
      type: object
      required: [id, email, name, linkedAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        linkedAt:
          type: string

    LinkedProviders:
      type: object
      required: [hasPassword]
      properties:
        hasPassword:
          type: boolean
        google:
          $ref: "#/components/schemas/OAuthProvider"
        apple:
          $ref: "#/components/schemas/OAuthProvider"

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        imageUrl:
          type: string
          maxLength: 2048

    VerifyReceiptInput:
      type: object
      required: [platform, productId]
      properties:
        platform:
          type: string
          enum: [android, ios]
        productId:
          type: string
        purchaseToken:
          type: string
        transactionId:
          type: string
        receiptData:
          type: string

    VerifyReceiptResult:
      type: object
      required: [valid, subscriptionTier, source]
      properties:
        valid:
          type: boolean
        subscriptionTier:
          $ref: "#/components/schemas/SubscriptionTier"
        subscriptionExpiresAt:
          type: ["string", "null"]
          format: date-time
        source:
          type: string

    SubTask:
      type: object
      properties:
        id:
          type: integer
        taskId:
          type: integer
        title:
          type: ["string", "null"]
        isFinished:
          type: boolean

    Task:
      type: object
      properties:
        id:
          type: integer
        syncId:
          type: string
        userId:
          type: string
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        energyLevel:
          type: ["string", "null"]
        recurrenceRule:
          type: ["string", "null"]
        recurringTemplateId:
          type: ["string", "null"]
        createdDate:
          type: ["string", "null"]
          format: date-time
        finishDate:
          type: ["string", "null"]
          format: date-time
        isFinished:
          type: boolean
        priority:
          type: integer
        category:
          type: ["string", "null"]
        estimatedPomodoros:
          type: integer
        completedPomodoros:
          type: integer
        focusedSeconds:
          type: integer
        trackingMode:
          $ref: "#/components/schemas/FocusMode"
        completedFlowtimeSessions:
          type: integer
        completedTimeblockSessions:
          type: integer
        completedStopwatchSeconds:
          type: integer
        focusedSecondsPomodoro:
          type: integer
        focusedSecondsFlowtime:
          type: integer
        focusedSecondsTimeblock:
          type: integer
        focusedSecondsStopwatch:
          type: integer
        activeSessionId:
          type: ["string", "null"]
        isDeleted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        subTasks:
          type: array
          items:
            $ref: "#/components/schemas/SubTask"

    TaskSyncRequest:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        deletedSyncIds:
          type: array
          items:
            type: string
        lastSyncAt:
          type: ["string", "null"]
          format: date-time

    TaskSyncResponse:
      type: object
      required: [tasks, deletedSyncIds, appliedSyncIds, rejectedSyncIds, syncTimestamp]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        deletedSyncIds:
          type: array
          items:
            type: string
        appliedSyncIds:
          type: array
          items:
            type: string
        rejectedSyncIds:
          type: array
          items:
            type: string
        syncTimestamp:
          type: string
          format: date-time

    GenerateRecurrencesRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string

    GenerateRecurrencesResponse:
      type: object
      required: [created, count]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        count:
          type: integer

    FocusConfig:
      type: object
      properties:
        userId:
          type: string
        defaultMode:
          $ref: "#/components/schemas/FocusMode"
        pomodoroMinutes:
          type: integer
        shortBreakMinutes:
          type: integer
        longBreakMinutes:
          type: integer
        pomodorosUntilLong:
          type: integer
        flowtimeCheckInMinutes:
          type: integer
        timeblockMinutes:
          type: integer
        dailyGoal:
          type: integer
        notifications:
          type: boolean
        autoStart:
          type: boolean
        autoBreak:
          type: boolean
        lastUpdate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FocusSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        taskId:
          type: ["integer", "null"]
        taskSyncId:
          type: ["string", "null"]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        mode:
          $ref: "#/components/schemas/FocusMode"
        phase:
          $ref: "#/components/schemas/FocusPhase"
        durationSeconds:
          type: integer
        elapsedSeconds:
          type: integer
        pauseCount:
          type: integer
        totalPauseSeconds:
          type: integer
        wasCompleted:
          type: boolean
        sharedWithTaskIds:
          type: ["string", "null"]
        interruptions:
          type: integer
        pomodoroNumber:
          type: integer
        satisfactionRating:
          type: integer
        journalNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FocusStats:
      type: object
      properties:
        id:

name: Pepinillo

options:
  bundleIdPrefix: com.pepinillo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.2"
  generateEmptyDirectories: true
  defaultConfig: Debug

packages:
  swift-composable-architecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.12.1"
  purchases-ios:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: "5.0.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

configs:
  Debug: debug
  Staging: release
  Release: release

targets:
  Pepinillo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.app
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - remote-notification
        API_BASE_URL: "$(API_BASE_URL)"
        WS_BASE_URL: "$(WS_BASE_URL)"
        APP_ENVIRONMENT: "$(APP_ENVIRONMENT)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        NSUserNotificationUsageDescription: >
          Pepinillo sends reminders to start your focus sessions and notifies
          you when a Pomodoro or break is complete.
        NSHealthUpdateUsageDescription: >
          Pepinillo logs your focus sessions as Mindful Minutes in Apple Health
          to help you track your wellbeing alongside your productivity.
        NSHealthShareUsageDescription: >
          Pepinillo reads your Mindful Minutes from Apple Health to show your
          focus history and keep your analytics accurate across devices.
        NSCalendarsUsageDescription: >
          Pepinillo reads your Calendar events so you can plan focus sessions
          around your existing schedule.
        NSCalendarsFullAccessUsageDescription: >
          Pepinillo reads and updates your Calendar so your focus sessions
          appear alongside your existing schedule.
        NSSiriUsageDescription: >
          Pepinillo uses Siri so you can start and stop focus sessions with
          your voice.
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes:
          - com.pepinillo.app.focusSession
          - com.pepinillo.app.viewAnalytics
          - com.pepinillo.app.viewTask
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: com.pepinillo.app
            CFBundleURLSchemes:
              - pepinillo
    entitlements:
      path: App/Pepinillo.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.pepinillo.app
        com.apple.developer.healthkit: true
        com.apple.developer.siri: true
        com.apple.developer.usernotifications.communication: true
    sources:
      - path: App
      - path: Features
      - path: Domain
      - path: Shared
      - path: PepinilloWidget/WidgetIntents.swift
      - path: PepinilloIntents
      - path: PepinilloLiveActivity/LiveActivityManager.swift
      - path: PepinilloLiveActivity/FocusActivityAttributes.swift
      - path: PepinilloWatch/Features
      - path: PepinilloWatch/WatchStatsKeys.swift
    resources:
      - path: Shared/Resources
        optional: true
      - path: App/PrivacyInfo.xcprivacy
      - path: Pepinillo.storekit
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: sentry-cocoa
        product: Sentry
      - package: purchases-ios
        product: RevenueCat
      - target: PepinilloWidgetExtension
        embed: true
      - target: PepinilloControlCenter
        embed: true
      - target: PepinilloWatch
        embed: true
        buildPhase: embedWatchContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SUPPORTS_MACCATALYST: "YES"

  PepinilloMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    bundleId: com.pepinillo.app
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        API_BASE_URL: "$(API_BASE_URL)"
        WS_BASE_URL: "$(WS_BASE_URL)"
        APP_ENVIRONMENT: "$(APP_ENVIRONMENT)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        NSUserNotificationUsageDescription: >
          Pepinillo sends reminders to start your focus sessions and notifies
          you when a Pomodoro or break is complete.
        NSCalendarsUsageDescription: >
          Pepinillo reads your Calendar events so you can plan focus sessions
          around your existing schedule.
        NSCalendarsFullAccessUsageDescription: >
          Pepinillo reads and updates your Calendar so your focus sessions
          appear alongside your existing schedule.
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes:
          - com.pepinillo.app.focusSession
          - com.pepinillo.app.viewAnalytics
          - com.pepinillo.app.viewTask
        CFBundleURLTypes:
          - CFBundleURLName: com.pepinillo.app
            CFBundleURLSchemes:
              - pepinillo
    sources:
      - path: Mac
      - path: App/AppFeature.swift
      - path: App/DemoDataSeeder.swift
      - path: App/MacCommands.swift
      - path: Features
      - path: Domain
      - path: Shared
      - path: PepinilloIntents
        excludes:
          - FocusFilterIntent.swift
    resources:
      - path: Shared/Resources
        optional: true
      - path: App/PrivacyInfo.xcprivacy
      - path: Pepinillo.storekit
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: sentry-cocoa
        product: Sentry
      - package: purchases-ios
        product: RevenueCat
      - target: PepinilloWidgetMacExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        ENABLE_HARDENED_RUNTIME: "YES"
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Mac/PepinilloMacDebug.entitlements
          ENABLE_HARDENED_RUNTIME: "NO"
        Staging:
          CODE_SIGN_ENTITLEMENTS: Mac/PepinilloMac.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Mac/PepinilloMac.entitlements

  PepinilloWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.app.widget
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: PepinilloWidget/Info.plist
      properties:
        CFBundleDisplayName: PepinilloWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: PepinilloWidget/PepinilloWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app
    sources:
      - path: PepinilloWidget
      - path: PepinilloLiveActivity
      - path: Features/Focus/FocusModels.swift
      - path: Domain/Clients/LiveActivityClient.swift
      - path: Domain/Models
      - path: Shared/Persistence/AppGroupContainer.swift
      - path: Shared/Persistence/SchemaVersioning.swift
      - path: Shared/Design/ModeColors.swift
      - path: Shared/Design/PhaseColors.swift
      - path: Shared/Design/SystemColors.swift
      - path: Shared/Design/GlassModifiers.swift
      - path: Shared/Design/WidgetGlassBackground.swift
    resources:
      - path: Shared/Resources/Localizable.xcstrings
        optional: true
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.widget
        SKIP_INSTALL: "YES"

  PepinilloWidgetMacExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    bundleId: com.pepinillo.app.widget
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: PepinilloWidget/Info.plist
      properties:
        CFBundleDisplayName: PepinilloWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: false
    entitlements:
      path: PepinilloWidget/PepinilloWidget.entitlements
    sources:
      - path: PepinilloWidget
      - path: PepinilloLiveActivity
        excludes:
          - "**/*"
      - path: Features/Focus/FocusModels.swift
      - path: Domain/Clients/LiveActivityClient.swift
        excludes:
          - "**/*"
      - path: Domain/Models
      - path: Shared/Persistence/AppGroupContainer.swift
      - path: Shared/Persistence/SchemaVersioning.swift
      - path: Shared/Design/ModeColors.swift
      - path: Shared/Design/PhaseColors.swift
      - path: Shared/Design/SystemColors.swift
      - path: Shared/Design/GlassModifiers.swift
      - path: Shared/Design/WidgetGlassBackground.swift
    resources:
      - path: Shared/Resources/Localizable.xcstrings
        optional: true
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.widget
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "NO"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: PepinilloWidget/PepinilloWidgetMacDebug.entitlements
        Staging:
          CODE_SIGN_ENTITLEMENTS: PepinilloWidget/PepinilloWidget.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: PepinilloWidget/PepinilloWidget.entitlements

  PepinilloWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.pepinillo.app.watch
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: PepinilloWatch/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pepinillo.app
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        API_BASE_URL: "$(API_BASE_URL)"
        WS_BASE_URL: "$(WS_BASE_URL)"
        APP_ENVIRONMENT: "$(APP_ENVIRONMENT)"
    entitlements:
      path: PepinilloWatch/PepinilloWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app
    sources:
      - path: PepinilloWatch
      - path: Domain/Models
      - path: Domain/Clients
        excludes:
          - "SoundscapeClient.swift"
          - "PersistenceClient.swift"
          - "NotificationClient.swift"
          - "SpotlightClient.swift"
          - "CalendarClient.swift"
          - "HealthClient.swift"
          - "AIReportClient.swift"
          - "SyncClient.swift"
      - path: Features/Focus/FocusModels.swift
      - path: Shared/Design
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.watch
        SWIFT_EMIT_LOC_STRINGS: "YES"

  PepinilloControlCenter:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    bundleId: com.pepinillo.app.controlcenter
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: ControlCenterExtension/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo Focus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ControlCenterExtension/PepinilloControlCenter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app
    sources:
      - path: ControlCenterExtension
      - path: Shared/Persistence/AppGroupContainer.swift
      - path: Shared/Persistence/SchemaVersioning.swift
      - path: Domain/Models
      - path: Features/Focus/FocusModels.swift
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.controlcenter
        SKIP_INSTALL: "YES"

  PepinilloTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.tests
    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    sources:
      - path: Tests
    dependencies:
      - target: Pepinillo
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TESTING
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pepinillo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pepinillo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Pepinillo Dev:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Debug
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    test:
      config: Debug
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  Pepinillo Staging:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Staging
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    test:
      config: Staging
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  Pepinillo Production:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Release
      commandLineArguments: {}
    test:
      config: Release
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  PepinilloMac Dev:
    build:
      targets:
        PepinilloMac: all
        PepinilloWidgetMacExtension: [build]
    run:
      config: Debug
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  PepinilloMac Staging:
    build:
      targets:
        PepinilloMac: all
        PepinilloWidgetMacExtension: [build]
    run:
      config: Staging
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  PepinilloMac Production:
    build:
      targets:
        PepinilloMac: all
        PepinilloWidgetMacExtension: [build]
    run:
      config: Release
      commandLineArguments: {}
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

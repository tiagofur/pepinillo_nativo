# project.yml — XcodeGen spec for Pepinillo
#
# Usage (on Mac):
#   brew install xcodegen
#   cd /path/to/pepinillo_ios
#   xcodegen generate
#
# This generates Pepinillo.xcodeproj with all 5 targets configured.
# Adjust DEVELOPMENT_TEAM in Config/Shared.xcconfig to your Apple Developer
# Team ID before archiving. Automatic code signing is enabled.
#
# Build configurations:
#   - Debug           → Config/Dev.xcconfig         (API: localhost:8080)
#   - Staging         → Config/Staging.xcconfig     (API: staging.api.ppn.creapolis.dev)
#   - Release         → Config/Production.xcconfig  (API: api.ppn.creapolis.dev)
#
# Schemes:
#   - Pepinillo Dev         → runs Debug config
#   - Pepinillo Staging     → runs Staging config
#   - Pepinillo Production  → runs Release config (archive-ready)
#
# Required one-time steps after generation:
#   1. Open in Xcode → confirm SPM resolves TCA + RevenueCat + Snapshot
#   2. Set your Team in Config/Shared.xcconfig (DEVELOPMENT_TEAM)
#   3. Keep iCloud / CloudKit disabled for the 1.0 release build.
#   4. StoreKit config is auto-attached to the Dev scheme for sandbox testing

name: Pepinillo

options:
  bundleIdPrefix: com.pepinillo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.2"
  generateEmptyDirectories: true
  defaultConfig: Debug

# ── SPM Packages ────────────────────────────────────────────────────────────
# Note: XcodeGen resolves these but Xcode may ask to re-resolve on first open.
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.36.0"

# ── Build Settings (shared across all targets) ───────────────────────────────
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

# ── Configs ──────────────────────────────────────────────────────────────────
# Three build configurations mapped to xcconfig files per target (see
# configFiles: blocks on each target below).
configs:
  Debug: debug
  Staging: release
  Release: release

# ── Targets ──────────────────────────────────────────────────────────────────
targets:

  # ── Main iOS App ─────────────────────────────────────────────────────────
  Pepinillo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.app

    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Background modes required for soundscape playback and push-driven sync.
        UIBackgroundModes:
          - audio
          - remote-notification
        # Exposed from xcconfig into Info.plist so runtime code (APIClient,
        # WebSocketClient) can read the per-environment base URL via Bundle.
        API_BASE_URL: "$(API_BASE_URL)"
        WS_BASE_URL: "$(WS_BASE_URL)"
        APP_ENVIRONMENT: "$(APP_ENVIRONMENT)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        # Privacy usage descriptions (required for App Store review)
        NSUserNotificationUsageDescription: >
          Pepinillo sends reminders to start your focus sessions and notifies
          you when a Pomodoro or break is complete.
        NSHealthUpdateUsageDescription: >
          Pepinillo logs your focus sessions as Mindful Minutes in Apple Health
          to help you track your wellbeing alongside your productivity.
        NSHealthShareUsageDescription: >
          Pepinillo reads your Mindful Minutes from Apple Health to show your
          focus history and keep your analytics accurate across devices.
        NSCalendarsUsageDescription: >
          Pepinillo reads your Calendar events so you can plan focus sessions
          around your existing schedule.
        NSCalendarsFullAccessUsageDescription: >
          Pepinillo reads and updates your Calendar so your focus sessions
          appear alongside your existing schedule.
        NSSiriUsageDescription: >
          Pepinillo uses Siri so you can start and stop focus sessions with
          your voice.
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes:
          - com.pepinillo.app.focusSession
          - com.pepinillo.app.viewAnalytics
          - com.pepinillo.app.viewTask
          - INSendMessageIntent

    entitlements:
      path: App/Pepinillo.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.pepinillo.app
        com.apple.developer.healthkit: true
        com.apple.developer.siri: true
        com.apple.developer.usernotifications.communication: true

    sources:
      - path: App
      - path: Features
      - path: Domain
      - path: Shared
      # App Intents compile directly into the main app (no separate extension needed)
      - path: PepinilloIntents
      # Live Activity manager (ActivityKit implementation injected at app launch)
      - path: PepinilloLiveActivity/LiveActivityManager.swift
      - path: PepinilloLiveActivity/FocusActivityAttributes.swift
      # Watch feature reducers (shared for testability — WatchKit calls are #if os(watchOS) guarded)
      - path: PepinilloWatch/Features
      - path: PepinilloWatch/WatchStatsKeys.swift

    resources:
      - path: Shared/Resources
        optional: true
      - path: App/PrivacyInfo.xcprivacy
      - path: Pepinillo.storekit

    dependencies:
      - package: ComposableArchitecture
      - package: Sentry
        product: Sentry
      # Embed extensions so they are included in the app bundle's PlugIns directory
      - target: PepinilloWidgetExtension
        embed: true
      - target: PepinilloControlCenter
        embed: true
      - target: PepinilloWatch
        embed: true
        buildPhase: embedWatchContent

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SUPPORTS_MACCATALYST: "YES"

  # ── Widget Extension (Home Screen, Lock Screen, Live Activities) ────────
  PepinilloWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.app.widget

    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig

    info:
      path: PepinilloWidget/Info.plist
      properties:
        CFBundleDisplayName: PepinilloWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Live Activities entitlement (enabled via capability)
        NSSupportsLiveActivities: true

    entitlements:
      path: PepinilloWidget/PepinilloWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app

    sources:
      - path: PepinilloWidget
      # Live Activities are part of the Widget extension in iOS 16.1+
      - path: PepinilloLiveActivity
      # Shared types needed by widget and live activity
      - path: Features/Focus/FocusModels.swift
      - path: Domain/Clients/LiveActivityClient.swift
      - path: Domain/Models
      - path: Shared/Persistence/AppGroupContainer.swift
      - path: Shared/Persistence/SchemaVersioning.swift
      - path: Shared/Design/ModeColors.swift
      - path: Shared/Design/PhaseColors.swift

    dependencies:
      - package: ComposableArchitecture

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.widget
        SKIP_INSTALL: "YES"

  # ── Apple Watch App ──────────────────────────────────────────────────────
  # Single-target Watch app (Xcode 14+ / watchOS 7+ style)
  PepinilloWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: com.pepinillo.app.watch

    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig

    info:
      path: PepinilloWatch/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pepinillo.app
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Expose the per-environment URL to the Watch app as well (used by any
        # future direct networking; today WatchConnectivity forwards data).
        API_BASE_URL: "$(API_BASE_URL)"
        WS_BASE_URL: "$(WS_BASE_URL)"
        APP_ENVIRONMENT: "$(APP_ENVIRONMENT)"

    entitlements:
      path: PepinilloWatch/PepinilloWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app

    sources:
      - path: PepinilloWatch
      # Watch needs access to shared domain models and design system
      - path: Domain/Models
      - path: Domain/Clients
        excludes:
          - "SoundscapeClient.swift"
          - "PersistenceClient.swift"
          - "NotificationClient.swift"
          - "SpotlightClient.swift"
          - "CalendarClient.swift"
          - "HealthClient.swift"
          - "AIReportClient.swift"
          - "SyncClient.swift"
      - path: Features/Focus/FocusModels.swift
      - path: Shared/Design

    dependencies:
      - package: ComposableArchitecture

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.watch
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # ── Control Center Extension ─────────────────────────────────────────────
  # Requires iOS 18+ and the "Control Center" capability in Xcode
  PepinilloControlCenter:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    bundleId: com.pepinillo.app.controlcenter

    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig

    info:
      path: ControlCenterExtension/Info.plist
      properties:
        CFBundleDisplayName: Pepinillo Focus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    entitlements:
      path: ControlCenterExtension/PepinilloControlCenter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pepinillo.app

    sources:
      - path: ControlCenterExtension
      - path: Shared/Persistence/AppGroupContainer.swift
      - path: Shared/Persistence/SchemaVersioning.swift
      - path: Domain/Models
      - path: Features/Focus/FocusModels.swift

    dependencies: []

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.app.controlcenter
        SKIP_INSTALL: "YES"

  # ── Unit Tests ───────────────────────────────────────────────────────────
  PepinilloTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.pepinillo.tests

    configFiles:
      Debug: Config/Dev.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig

    sources:
      - path: Tests

    dependencies:
      - target: Pepinillo
      - package: SnapshotTesting

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pepinillo.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TESTING
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pepinillo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pepinillo"
        BUNDLE_LOADER: "$(TEST_HOST)"

# ── Schemes ──────────────────────────────────────────────────────────────────
# Three schemes so developers can toggle environment from the Xcode scheme
# picker without touching build settings. Each scheme pins a specific
# configuration to Run/Test/Profile/Analyze/Archive.
schemes:
  Pepinillo Dev:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Debug
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    test:
      config: Debug
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  Pepinillo Staging:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Staging
      commandLineArguments: {}
      storeKitConfiguration: Pepinillo.storekit
    test:
      config: Staging
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  Pepinillo Production:
    build:
      targets:
        Pepinillo: all
        PepinilloWidgetExtension: [build]
        PepinilloWatch: [build]
        PepinilloTests: [test]
    run:
      config: Release
      commandLineArguments: {}
    test:
      config: Release
      targets:
        - name: PepinilloTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
